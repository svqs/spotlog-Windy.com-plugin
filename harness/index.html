<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spotlog sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #2e2e2e; font-family: system-ui, sans-serif; color: #f8f8f8; }
  .wrap { display: flex; height: 100vh; min-height: 640px; }
  #map { position: relative; flex: 1; overflow: hidden; cursor: crosshair; background: #3fa0a8; }
  .world { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; pointer-events: none; background: radial-gradient(ellipse 40% 20% at 62% 70%, #e0a63a 0%, rgba(224,166,58,0) 100%), radial-gradient(ellipse 55% 30% at 60% 72%, #d4c43a 0%, rgba(212,196,58,0) 100%), radial-gradient(ellipse 45% 45% at 15% 25%, #4dbb5f 0%, rgba(77,187,95,0) 100%), linear-gradient(165deg, #5b6ec2 0%, #3fa0a8 36%, #4dbb5f 62%, #3fa0a8 100%); }
  .world svg.coast { position: absolute; inset: 0; width: 100%; height: 100%; }
  #map svg.coast { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #pane { width: 400px; flex-shrink: 0; overflow: hidden; height: 100%; background: #2e2e2e; box-shadow: -2px 0 14px rgba(0,0,0,.35); }
  .label { position: absolute; transform: translate(-50%, -50%); font: 600 13px system-ui; text-shadow: 0 1px 3px rgba(0,0,0,.7); cursor: pointer; white-space: nowrap; }
  .label::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 3px; background: #f8f8f8; margin-right: 5px; vertical-align: middle; }
  .mock-marker { position: absolute; width: 0; height: 0; }
  .plugin__mobile-header { display: none; }
  .mock-marker.pulse .pulse-dot { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 9px; background: #f8f8f8; box-shadow: 0 0 0 6px rgba(248,248,248,.35); }
  .bar { position: absolute; left: 14px; bottom: 14px; display: flex; gap: 2px; padding: 4px; border-radius: 10px; background: rgba(64,64,64,.85); font-size: 13px; }
  .bar button { border: 0; background: transparent; color: #f8f8f8; padding: 6px 9px; border-radius: 7px; cursor: pointer; font: inherit; }
  .bar button.on { background: #d49500; color: #1c1c1c; font-weight: 700; }
  .banner { position: absolute; left: 14px; top: 12px; right: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { padding: 7px 12px; border-radius: 16px; background: #f8f8f8; color: #3c3c3c; font-size: 13px; }
  .pill b { color: #1c1c1c; }
  .note { background: rgba(28,28,28,.8); color: #f8f8f8; }
  /* like real Windy on desktop: the ✕ sits just outside the pane, on its left */
  .w-closing-x { position: fixed; top: 12px; right: 412px; z-index: 40; width: 30px; height: 30px; border-radius: 15px; border: 0; background: rgba(0,0,0,.45); color: #f8f8f8; font: 600 14px system-ui, sans-serif; cursor: pointer; }
  @media (max-width: 760px) { .w-closing-x { display: none; } }
  /* phones: map on top, Windy's small pane under it, as tall as the plugin makes it */
  @media (max-width: 760px) { .wrap { flex-direction: column; height: 100dvh; min-height: 0; } #map { flex: 1; min-height: 0; } #pane { width: 100%; height: auto; flex: none; box-shadow: 0 -2px 14px rgba(0,0,0,.35); overflow: visible; position: relative; z-index: 5; } }
  .mock-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .mock-flash { position: absolute; width: 0; height: 0; pointer-events: none; }
  .mock-flash::after { content: ''; position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #f8f8f8; animation: flash 1.3s ease-out forwards; }
  @keyframes flash { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  .mock-popup { position: absolute; z-index: 20; transform: translate(-50%, calc(-100% - 16px)); filter: drop-shadow(0 6px 18px rgba(0,0,0,.4)); cursor: default; }
  .mock-popup .leaflet-popup-content-wrapper { background: #f8f8f8; color: #1c1c1c; border-radius: 16px; }
  .mock-popup .leaflet-popup-content { margin: 0; padding: 12px; }
  .mock-popup::after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: #f8f8f8; }
  .mock-popup-x { position: absolute; right: 6px; top: 4px; width: 26px; height: 26px; border: 0; background: none; color: #6b6b6b; font-size: 18px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div id="map">
    <div class="world" id="world"><svg class="coast" viewBox="0 0 1000 900" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 150 C110 190 200 280 290 370 C340 420 400 470 460 505 C520 540 570 575 612 612 C650 598 700 566 752 548 L772 590 L792 540 C850 480 940 440 1000 420" fill="none" stroke="#1b1b1b" stroke-opacity=".6" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
      <path d="M380 900 C470 800 560 760 650 752 C720 746 800 762 856 800 C900 792 960 766 1000 780" fill="none" stroke="#1b1b1b" stroke-opacity=".6" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    </svg></div>
    <div class="banner">
      <span class="pill"><b>Sandbox</b> · fake Windy map & forecast, real Spotlog plugin code</span>
      <span class="pill note">Click the map or a place name. The timeline below sets the forecast time.</span>
    </div>
    <div class="bar" id="timeline"></div>
  </div>
  <div id="pane"></div>
</div>
<script src="./mock-windy.js"></script>
<script type="module">
  import Plugin from '../dist/plugin.js';
  const mapEl = document.getElementById('map');
  const { project, unproject, singleclick, store, PLACES } = W.__mock;
  const NAME = 'windy-plugin-spotlog';

  // place names on the map (like Windy's city labels)
  const drawLabels = () => {
    mapEl.querySelectorAll('.label').forEach(n => n.remove());
    PLACES.filter(p => !p.hidden).forEach(p => {
      const el = document.createElement('div');
      el.className = 'label';
      el.textContent = p.name;
      const pos = project(p.lat, p.lon);
      el.style.left = pos.x + 'px'; el.style.top = (pos.y - 18) + 'px';
      el.addEventListener('click', e => { e.stopPropagation(); singleclick.emit(NAME, { lat: p.lat, lon: p.lon, source: 'singleclick' }); });
      mapEl.appendChild(el);
    });
  };
  drawLabels();

  // the fake map can pan and zoom: keep background, coast and labels in step
  const worldEl = document.getElementById('world');
  const syncWorld = () => { const { INIT, view } = W.__mock; const q = project(INIT.north, INIT.west); worldEl.style.transform = `translate(${q.x}px, ${q.y}px) scale(${1 / view.k})`; };
  W.__mock.onMove(() => { syncWorld(); drawLabels(); });

  mapEl.addEventListener('click', e => {
    const r = mapEl.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const { lat, lon } = unproject(x, y);
    singleclick.emit(NAME, { lat, lon, x, y, source: 'singleclick' });
  });

  // timeline: next 5 days at 10:00, 13:00, 16:00
  const tl = document.getElementById('timeline');
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const slots = [];
  for (let d = 0; d < 5; d++) for (const h of [10, 13, 16]) slots.push(+start + d * 864e5 + h * 3600e3);
  const render = () => {
    tl.innerHTML = '';
    slots.forEach(ts => {
      const b = document.createElement('button');
      const dt = new Date(ts);
      b.textContent = dt.toLocaleDateString(undefined, { weekday: 'short' }) + ' ' + dt.getHours() + 'h';
      if (ts === store.get('timestamp')) b.className = 'on';
      b.addEventListener('click', e => { e.stopPropagation(); store.set('timestamp', ts); render(); });
      tl.appendChild(b);
    });
  };
  store.set('timestamp', slots.find(s => s > Date.now()) || slots[0]);
  render();

  window.spotlog = new Plugin({ target: document.getElementById('pane') });
</script>
</body>
</html>

<title>Spotlog Sandbox</title>
<meta name="description" content="The real Spotlog Windy plugin running beside a simulated Windy map, timeline and forecast.">
<style>
  /* Layout: fake Windy map fills the left, the real plugin panel sits in a 400 px right-hand pane (stacked on phones). */
  :root {
    color-scheme: dark;
    --ground: #2e2e2e;
    --card: #3c3c3c;
    --line: #4d4d4d;
    --text: #f8f8f8;
    --sub: #b0b0b0;
    --ink: #1c1c1c;
    --orange: #d49500;
    --glass: rgba(40, 40, 40, 0.88);
    --ui: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { background: var(--ground); color: var(--text); font-family: var(--ui); }
  .app { display: flex; height: 100%; min-height: 560px; }
  #map { position: relative; flex: 1; min-width: 0; overflow: hidden; cursor: crosshair; background: #3fa0a8; }
  .world { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; pointer-events: none; background:
      radial-gradient(ellipse 40% 20% at 62% 70%, #e0a63a 0%, rgba(224,166,58,0) 100%),
      radial-gradient(ellipse 55% 30% at 60% 72%, #d4c43a 0%, rgba(212,196,58,0) 100%),
      radial-gradient(ellipse 45% 45% at 15% 25%, #4dbb5f 0%, rgba(77,187,95,0) 100%),
      linear-gradient(165deg, #5b6ec2 0%, #3fa0a8 36%, #4dbb5f 62%, #3fa0a8 100%); }
  .world svg.coast { position: absolute; inset: 0; width: 100%; height: 100%; }
  #map svg.coast { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #pane { width: 400px; flex-shrink: 0; overflow: hidden; height: 100%; background: var(--ground); box-shadow: -2px 0 14px rgba(0,0,0,.35); }
  .plugin__mobile-header { display: none; }
  .label { position: absolute; transform: translate(-50%, -50%); font: 600 13px var(--ui); color: var(--text); text-shadow: 0 1px 3px rgba(0,0,0,.7); cursor: pointer; white-space: nowrap; }
  .label::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 3px; background: var(--text); margin-right: 5px; vertical-align: middle; }
  .mock-marker { position: absolute; width: 0; height: 0; }
  .mock-marker.pulse .pulse-dot { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 9px; background: var(--text); box-shadow: 0 0 0 6px rgba(248,248,248,.35); animation: pulse 1.6s ease-out infinite; }
  /* like real Windy on desktop: the ✕ sits just outside the pane, on its left */
  .w-closing-x { position: fixed; top: 12px; right: 412px; z-index: 40; width: 30px; height: 30px; border-radius: 15px; border: 0; background: rgba(0,0,0,.45); color: #f8f8f8; font: 600 14px system-ui, sans-serif; cursor: pointer; }
  @media (max-width: 760px) { .w-closing-x { display: none; } }
  .mock-line { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .mock-flash { position: absolute; width: 0; height: 0; pointer-events: none; }
  .mock-flash::after { content: ''; position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%; border: 2px solid #f8f8f8; animation: flash 1.3s ease-out forwards; }
  @keyframes flash { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
  .mock-popup { position: absolute; z-index: 20; transform: translate(-50%, calc(-100% - 16px)); filter: drop-shadow(0 6px 18px rgba(0,0,0,.4)); cursor: default; }
  .mock-popup .leaflet-popup-content-wrapper { background: #f8f8f8; color: #1c1c1c; border-radius: 16px; }
  .mock-popup .leaflet-popup-content { margin: 0; padding: 12px; }
  .mock-popup::after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -8px; border: 8px solid transparent; border-bottom: 0; border-top-color: #f8f8f8; }
  .mock-popup-x { position: absolute; right: 6px; top: 4px; width: 26px; height: 26px; border: 0; background: none; color: #6b6b6b; font-size: 18px; cursor: pointer; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(248,248,248,.5); } 100% { box-shadow: 0 0 0 14px rgba(248,248,248,0); } }
  @media (prefers-reduced-motion: reduce) { .mock-marker.pulse .pulse-dot { animation: none; } }
  .sb-top { position: absolute; left: 14px; right: 14px; top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
  .sb-top > * { pointer-events: auto; }
  .sb-name { padding: 7px 12px; border-radius: 16px; background: var(--text); color: var(--ink); font-size: 13px; font-weight: 600; }
  .sb-tip { padding: 7px 12px; border-radius: 16px; background: var(--glass); font-size: 13px; }
  .sb-grow { flex: 1; }
  .sb-tool { height: 34px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); color: var(--text); font: 600 13px var(--ui); cursor: pointer; }
  .sb-tool:focus-visible, .sb-bar button:focus-visible, .sb-copy:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
  .sb-bar { position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; gap: 2px; padding: 4px; border-radius: 10px; background: var(--glass); font-size: 13px; overflow-x: auto; }
  .sb-bar button { flex-shrink: 0; border: 0; background: transparent; color: var(--text); padding: 6px 9px; border-radius: 7px; cursor: pointer; font: inherit; font-variant-numeric: tabular-nums; }
  .sb-bar button.on { background: var(--orange); color: var(--ink); font-weight: 700; }
  .sb-legend { position: absolute; right: 14px; bottom: 62px; display: flex; justify-content: space-between; gap: 8px; width: 220px; max-width: calc(100% - 28px); padding: 3px 8px; border-radius: 6px; font-size: 11px; color: var(--text); text-shadow: 0 1px 2px rgba(0,0,0,.6);
    background: linear-gradient(90deg, #5b6ec2, #3fa0a8 12%, #4dbb5f 22%, #8fc446 34%, #d4c43a 46%, #e0a63a 58%, #e0873a 68%, #c9474f 82%, #a23fa0); }
  .sb-sheet { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.55); }
  .sb-sheet-in { width: min(720px, 100%); max-height: 86vh; display: flex; flex-direction: column; gap: 12px; padding: 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
  .sb-sheet-in h2 { margin: 0; font-size: 17px; text-wrap: balance; }
  .sb-sheet-in p { margin: 0; color: var(--sub); font-size: 13px; line-height: 1.45; max-width: 65ch; }
  .sb-sheet-in pre { margin: 0; min-width: 0; overflow: auto; padding: 12px; border-radius: 12px; background: var(--ground); color: var(--text); font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .sb-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .sb-copy { height: 40px; padding: 0 16px; border-radius: 12px; border: 0; background: var(--orange); color: var(--ink); font: 600 14px var(--ui); cursor: pointer; }
  .sb-copy.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  /* phones: like Windy's small bottom panel — map (with timeline) on top, Spotlog stacked below it */
  @media (max-width: 760px) {
    .app { flex-direction: column; height: 100dvh; min-height: 0; }
    #map { flex: 1; min-height: 0; }
    /* like Windy's small bottom panel: it takes the height the plugin gives itself */
    #pane { width: 100%; height: auto; flex: none; overflow: hidden; box-shadow: 0 -2px 14px rgba(0,0,0,.35); border-radius: 14px 14px 0 0; }
    .sb-tip { display: none; }
  }
</style>

<div class="app">
  <div id="map" aria-label="Simulated Windy map of the Strait of Gibraltar. Click to pick a place.">
    <div class="world" id="world"><svg class="coast" viewBox="0 0 1000 900" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 150 C110 190 200 280 290 370 C340 420 400 470 460 505 C520 540 570 575 612 612 C650 598 700 566 752 548 L772 590 L792 540 C850 480 940 440 1000 420" fill="none" stroke="#1b1b1b" stroke-opacity=".6" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
      <path d="M380 900 C470 800 560 760 650 752 C720 746 800 762 856 800 C900 792 960 766 1000 780" fill="none" stroke="#1b1b1b" stroke-opacity=".6" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    </svg></div>
    <div class="sb-top">
      <span class="sb-name">Spotlog sandbox</span>
      <span class="sb-tip">Fake Windy map and forecast, real plugin code. Click a place or spot · scroll to zoom · drag to pan</span>
      <span class="sb-grow"></span>
      <button class="sb-tool" id="showData" type="button">Saved data</button>
      <button class="sb-tool" id="resetMap" type="button">Reset map</button>
      <button class="sb-tool" id="reset" type="button">Reset examples</button>
    </div>
    <div class="sb-legend" aria-hidden="true"><span>m/s</span><span>0</span><span>3</span><span>5</span><span>10</span><span>15</span><span>20</span><span>30</span></div>
    <div class="sb-bar" id="timeline" aria-label="Forecast time"></div>
  </div>
  <div id="pane"></div>
</div>

<div class="sb-sheet" id="dataSheet" hidden>
  <div class="sb-sheet-in" role="dialog" aria-modal="true" aria-labelledby="dataTitle">
    <h2 id="dataTitle">What Spotlog has saved</h2>
    <p>This is exactly what the plugin stores in your browser. In Windy, Home › Data › Export JSON downloads the same thing as a file.</p>
    <pre id="dataPre"></pre>
    <div class="sb-row">
      <button class="sb-copy" id="copyData" type="button">Copy JSON</button>
      <button class="sb-copy ghost" id="closeData" type="button">Close</button>
    </div>
  </div>
</div>

<script>
// A tiny stand-in for windy.com so the real, compiled Spotlog plugin can run outside Windy.
// It fakes: the map + markers, singleclick, the timeline store, reverse geocoding and
// the point-forecast API (with slightly different numbers per model).

(function () {
    const listeners = {};
    const evented = () => {
        const subs = {};
        let id = 0;
        return {
            on(topic, cb) { id++; (subs[topic] = subs[topic] || []).push({ id, cb }); return id; },
            off(topicOrId, cb) {
                if (typeof topicOrId === 'number') {
                    Object.values(subs).forEach(l => { const i = l.findIndex(x => x.id === topicOrId); if (i > -1) l.splice(i, 1); });
                } else if (subs[topicOrId]) {
                    subs[topicOrId] = subs[topicOrId].filter(x => x.cb !== cb);
                }
            },
            emit(topic, ...args) { (subs[topic] || []).forEach(x => x.cb(...args)); },
        };
    };

    // ---- map projection over the Strait of Gibraltar ----
    const INIT = { north: 36.25, south: 35.85, west: -5.95, east: -5.35 };
    const BOUNDS = { ...INIT };
    const moveSubs = [];
    const mapEl = () => document.getElementById('map');
    const project = (lat, lon) => {
        const el = mapEl();
        return {
            x: ((lon - BOUNDS.west) / (BOUNDS.east - BOUNDS.west)) * el.clientWidth,
            y: ((BOUNDS.north - lat) / (BOUNDS.north - BOUNDS.south)) * el.clientHeight,
        };
    };
    const unproject = (x, y) => {
        const el = mapEl();
        return {
            lat: BOUNDS.north - (y / el.clientHeight) * (BOUNDS.north - BOUNDS.south),
            lon: BOUNDS.west + (x / el.clientWidth) * (BOUNDS.east - BOUNDS.west),
        };
    };

    const live = new Set();
    class Marker {
        constructor(latlng, opts) { this.latlng = latlng; this.opts = opts || {}; this.handlers = {}; }
        place() {
            const p = project(this.latlng.lat, this.latlng.lng);
            this.el.style.left = p.x + 'px';
            this.el.style.top = p.y + 'px';
        }
        addTo() {
            const el = document.createElement('div');
            el.className = 'mock-marker ' + (this.opts.icon?.className || 'pulse');
            el.innerHTML = this.opts.icon?.html || '<span class="pulse-dot"></span>';
            el.addEventListener('click', e => { e.stopPropagation(); (this.handlers.click || []).forEach(h => h(e)); });
            mapEl().appendChild(el);
            this.el = el;
            this.place();
            live.add(this);
            return this;
        }
        on(ev, h) { (this.handlers[ev] = this.handlers[ev] || []).push(h); return this; }
        remove() { this.el?.remove(); live.delete(this); return this; }
    }
    // ---- popups + polylines (the bits of Leaflet Spotlog uses) ----
    let openPopup = null;
    class Popup {
        constructor(opts) { this.opts = opts || {}; }
        setLatLng(ll) { this.ll = Array.isArray(ll) ? { lat: ll[0], lng: ll[1] } : ll; return this; }
        setContent(html) { this.html = html; return this; }
        place() { const p = project(this.ll.lat, this.ll.lng); this.el.style.left = p.x + 'px'; this.el.style.top = p.y + 'px'; }
        openOn() {
            openPopup?.remove();
            const el = document.createElement('div');
            el.className = 'mock-popup leaflet-popup ' + (this.opts.className || '');
            el.innerHTML = '<div class="leaflet-popup-content-wrapper"><div class="leaflet-popup-content">' + this.html + '</div></div><button class="mock-popup-x" aria-label="Close">×</button>';
            el.addEventListener('click', e => e.stopPropagation());
            el.querySelector('.mock-popup-x').addEventListener('click', () => this.remove());
            mapEl().appendChild(el);
            this.el = el; this.place(); live.add(this); openPopup = this;
            return this;
        }
        remove() { this.el?.remove(); live.delete(this); if (openPopup === this) openPopup = null; return this; }
    }
    class Polyline {
        constructor(pts, opts) { this.pts = pts.map(p => Array.isArray(p) ? { lat: p[0], lng: p[1] } : p); this.opts = opts || {}; }
        place() {
            this.path.setAttribute('points', this.pts.map(p => { const q = project(p.lat, p.lng); return q.x + ',' + q.y; }).join(' '));
        }
        addTo() {
            const ns = 'http://www.w3.org/2000/svg';
            const svg = document.createElementNS(ns, 'svg');
            svg.setAttribute('class', 'mock-line');
            const path = document.createElementNS(ns, 'polyline');
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', this.opts.color || '#d49500');
            path.setAttribute('stroke-width', this.opts.weight || 3);
            path.setAttribute('stroke-linejoin', this.opts.lineJoin || 'round');
            path.setAttribute('stroke-linecap', this.opts.lineCap || 'round');
            path.setAttribute('stroke-opacity', this.opts.opacity ?? 1);
            svg.appendChild(path);
            mapEl().appendChild(svg);
            this.el = svg; this.path = path; this.place(); live.add(this);
            return this;
        }
        getBounds() {
            const lats = this.pts.map(p => p.lat), lngs = this.pts.map(p => p.lng);
            return { south: Math.min(...lats), north: Math.max(...lats), west: Math.min(...lngs), east: Math.max(...lngs) };
        }
        remove() { this.el?.remove(); live.delete(this); return this; }
    }
    window.addEventListener('resize', () => live.forEach(m => m.place()));
    window.L = { Marker, divIcon: o => o, popup: o => new Popup(o), polyline: (p, o) => new Polyline(p, o) };

    // ---- a very small pan/zoom so centerMap, fitBounds and GPS tracks can be seen properly ----
    // k = how many times wider than the initial view (1 = initial, 0.1 = zoomed in 10x)
    const view = { k: 1 };
    const setView = (lat, lon, k) => {
        k = Math.max(0.02, Math.min(1.6, k));
        const hw = (INIT.east - INIT.west) * k / 2, hh = (INIT.north - INIT.south) * k / 2;
        Object.assign(BOUNDS, { north: lat + hh, south: lat - hh, west: lon - hw, east: lon + hw });
        view.k = k;
        live.forEach(m => m.place());
        moveSubs.forEach(f => f(BOUNDS, view.k));
    };
    const centre = () => ({ lat: (BOUNDS.north + BOUNDS.south) / 2, lng: (BOUNDS.west + BOUNDS.east) / 2 });
    const flash = (lat, lon) => {
        const p = project(lat, lon);
        const el = document.createElement('div');
        el.className = 'mock-flash';
        el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
        mapEl().appendChild(el);
        setTimeout(() => el.remove(), 1400);
    };
    const leafletMap = {
        getCenter: centre,
        getZoom: () => Math.round(11 - Math.log2(view.k)),
        on: (ev, f) => { if (ev === 'zoomend' || ev === 'moveend') moveSubs.push(f); },
        off: (ev, f) => { const i = moveSubs.indexOf(f); if (i >= 0) moveSubs.splice(i, 1); },
        fitBounds: (b, o) => {
            console.log('[W.map] fitBounds', b);
            const el = mapEl(), pad = (o && o.padding && o.padding[0]) || 0;
            const kx = (b.east - b.west) / (INIT.east - INIT.west) * el.clientWidth / Math.max(50, el.clientWidth - 2 * pad);
            const ky = (b.north - b.south) / (INIT.north - INIT.south) * el.clientHeight / Math.max(50, el.clientHeight - 2 * pad);
            setView((b.north + b.south) / 2, (b.west + b.east) / 2, Math.max(kx, ky, 0.02));
        },
    };
    const centerMap = c => {
        console.log('[W.map] centerMap', c);
        setView(c.lat, c.lon, c.zoom ? Math.pow(2, 11 - c.zoom) : view.k);
        flash(c.lat, c.lon);
    };

    // mouse wheel zooms around the cursor, dragging pans (a drag never counts as a map click)
    const attach = () => {
        const el = mapEl();
        if (!el) return;
        el.addEventListener('wheel', e => {
            if (e.target.closest('.top, .bar, .sb-top, .sb-bar, .banner, .mock-popup')) return;
            e.preventDefault();
            const r = el.getBoundingClientRect();
            const at = unproject(e.clientX - r.left, e.clientY - r.top);
            const f = Math.exp(Math.max(-0.5, Math.min(0.5, e.deltaY * 0.0025)));
            const k = Math.max(0.02, Math.min(1.6, view.k * f));
            const c = centre(), ratio = k / view.k;
            setView(at.lat + (c.lat - at.lat) * ratio, at.lon + (c.lng - at.lon) * ratio, k);
        }, { passive: false });
        let drag = null, panned = false;
        el.addEventListener('pointerdown', e => {
            if (e.button !== 0 || e.target.closest('.top, .bar, .banner, .mock-popup, .label, .mock-marker')) return;
            drag = { x: e.clientX, y: e.clientY, c: centre() }; panned = false;
        });
        window.addEventListener('pointermove', e => {
            if (!drag) return;
            const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
            if (!panned && Math.hypot(dx, dy) < 5) return;
            panned = true;
            const lonPerPx = (BOUNDS.east - BOUNDS.west) / el.clientWidth, latPerPx = (BOUNDS.north - BOUNDS.south) / el.clientHeight;
            setView(drag.c.lat + dy * latPerPx, drag.c.lng - dx * lonPerPx, view.k);
            el.style.cursor = 'grabbing';
        });
        window.addEventListener('pointerup', () => { drag = null; el.style.cursor = ''; });
        el.addEventListener('click', e => { if (panned) { e.stopImmediatePropagation(); panned = false; } }, true);
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', attach); else attach();

    // ---- timeline ----
    const store = evented();
    const now = new Date();
    now.setMinutes(0, 0, 0);
    // a logged-in Windy Premium user (Spotlog is for Premium members). Try store.set('user', null) or store.set('subscription', null).
    const state = {
        timestamp: +now + 3 * 3600e3, product: 'ecmwf', overlay: 'wind',
        user: { id: 12345, username: 'sophia', email: 'sophia@example.com' }, subscription: 'premium', userToken: 'mock-token-12345',
    };
    store.get = k => state[k];
    store.set = (k, v) => { state[k] = v; store.emit(k, v); };

    // ---- singleclick ----
    const singleclick = evented();

    // ---- fake point forecast ----
    const MODEL_OFFSET = { ecmwf: 0, gfs: -1.6, icon: 0.9, iconEu: 0.4, arome: -0.6 };
    const hash = (a, b) => Math.abs(Math.sin(a * 12.9898 + b * 78.233) * 43758.5453) % 1;
    const series = (model, lat, lon) => {
        const start = new Date(); start.setHours(0, 0, 0, 0);
        const out = { ts: [], hour: [], isDay: [], wind: [], windGust: [], windDir: [], temperature: [], waves: [], wavesPeriod: [], wavesPower: [], wavesDir: [], swell1: [], swell1Period: [], swell1Dir: [] };
        const base = 6 + hash(lat, lon) * 4;
        for (let i = 0; i < 24 * 8; i++) {
            const ts = +start + i * 3600e3;
            const h = new Date(ts).getHours();
            const day = Math.floor(i / 24);
            const diurnal = Math.sin(((h - 9) / 24) * Math.PI * 2) * 2.4;
            const synoptic = Math.sin(day / 1.3) * 2.2;
            const w = Math.max(0.5, base + diurnal + synoptic + (MODEL_OFFSET[model] || 0) + Math.sin(i / 3.1) * 0.6);
            const levante = day % 5 < 3;
            out.ts.push(ts); out.hour.push(h); out.isDay.push(h >= 8 && h <= 20 ? 1 : 0);
            out.wind.push(Math.round(w * 10) / 10);
            out.windGust.push(Math.round(w * 1.35 * 10) / 10);
            out.windDir.push(levante ? 100 + Math.sin(i / 5) * 12 : 270 + Math.sin(i / 5) * 15);
            out.temperature.push(273.15 + 19 + Math.sin(((h - 9) / 24) * Math.PI * 2) * 4);
            out.waves.push(Math.round((0.4 + w / 25) * 10) / 10);
            out.wavesPeriod.push(5 + Math.round(w / 6));
            out.wavesPower.push(Math.round((w / 8) * 10) / 10);
            out.wavesDir.push(levante ? 95 : 265);
            out.swell1.push(0.4); out.swell1Period.push(8); out.swell1Dir.push(250);
        }
        return out;
    };
    const getPointForecastData = async (model, { lat, lon }) => {
        await new Promise(r => setTimeout(r, 250 + Math.random() * 350));
        if (model === 'arome' && lat < 41) throw new Error('AROME covers France only');
        return { data: { data: series(model.replace('Waves', ''), lat, lon), header: { model } } };
    };

    // ---- reverse geocoding ----
    const PLACES = [
        { name: 'Tarifa', lat: 36.013, lon: -5.604 }, { name: 'Valdevaqueros', lat: 36.068, lon: -5.697 },
        { name: 'Bolonia', lat: 36.089, lon: -5.772 }, { name: 'Los Lances', lat: 36.03, lon: -5.62, hidden: true },
        { name: 'Punta Paloma', lat: 36.065, lon: -5.72, hidden: true }, { name: 'Zahara de los Atunes', lat: 36.137, lon: -5.846 },
    ];
    const reverseName = {
        get: async ({ lat, lon }) => {
            const d = p => Math.hypot(p.lat - lat, (p.lon - lon) * 0.8);
            const best = PLACES.slice().sort((a, b) => d(a) - d(b))[0];

  const snap = (id, spotId, lat, lon, ts, w, dir = 104) => ({
    id, spotId, lat, lon, ts, savedAt: ts - 7 * 3600e3, primary: 'ecmwf',
    models: [
      { model: 'ecmwf', ts, wind: w, gust: +(w * 1.35).toFixed(1), dir, temp: 23 },
      { model: 'gfs', ts, wind: +(w - 1.6).toFixed(1), gust: +((w - 1.6) * 1.3).toFixed(1), dir: dir - 6, temp: 22 },

      { model: 'iconEu', ts, wind: +(w + 0.4).toFixed(1), gust: +((w + 0.4) * 1.35).toFixed(1), dir: dir - 2, temp: 23 },

  });
  // a GPS track for one session: organic reaches off Valdevaqueros in a levante (easterly),
  // with jibes at both ends, slowly drifting downwind — roughly what a real windsurf GPX looks like
  const track = (() => {
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const M_LAT = 1 / 111320, M_LON = 1 / (111320 * Math.cos(36.06 * Math.PI / 180));
    let lat = 36.0655, lon = -5.6935, heading = 205, pts = [[lat, lon]];
    for (let leg = 0; leg < 16; leg++) {
      const len = 1300 + rnd() * 900, bend = (rnd() - 0.5) * 0.02, steps = Math.round(len / 55);
      for (let i = 0; i < steps; i++) {
        heading += bend * 55 + (rnd() - 0.5) * 2.2;
        const h = heading * Math.PI / 180;
        lat += Math.cos(h) * 55 * M_LAT; lon += Math.sin(h) * 55 * M_LON - 3 * M_LON; // drift west
        pts.push([+lat.toFixed(5), +lon.toFixed(5)]);
      }
      const turn = leg % 2 ? 1 : -1; // jibe: a tight arc
      for (let j = 0; j < 8; j++) {
        heading += turn * 180 / 8;
        const h = heading * Math.PI / 180;
        lat += Math.cos(h) * 14 * M_LAT; lon += Math.sin(h) * 14 * M_LON;
        pts.push([+lat.toFixed(5), +lon.toFixed(5)]);
      }
      heading += (rnd() - 0.5) * 20;
    }
    let km = 0;
    for (let i = 1; i < pts.length; i++) km += Math.hypot((pts[i][0] - pts[i - 1][0]) / M_LAT, (pts[i][1] - pts[i - 1][1]) / M_LON) / 1000;
    return { points: pts, start: t(1, 14.5), end: t(1, 17.1), distanceKm: +km.toFixed(1), durationMin: 156, maxSpeed: 11.6, source: 'valdevaqueros.gpx' };
  })();
  return {
    version: 1,
    spots: [
      { id: 'ex-valde', name: 'Valdevaqueros', place: 'Tarifa', lat: 36.068, lon: -5.697, sports: ['Windsurf'], dirs: ['E', 'SE'], min: 8, max: 13, created: t(40, 9) },
      { id: 'ex-bolonia', name: 'Bolonia', place: 'Tarifa', lat: 36.089, lon: -5.772, sports: ['Surf', 'Windsurf'], dirs: [], min: 6, max: 12, windUnknown: true, created: t(30, 9) },

      snap('ex-s2', 'ex-valde', 36.068, -5.697, t(4, 15), 11.8),

      snap('ex-s4', 'ex-valde', 36.068, -5.697, t(15, 15), 9.2),
      snap('ex-s5', 'ex-bolonia', 36.089, -5.772, t(6, 11), 7.1, 285),
      snap('ex-s6', 'ex-bolonia', 36.089, -5.772, t(12, 10), 8.3, 300),
    ],
    gear: [
      { id: 'ex-g1', name: 'Freewave 105 L', kind: 'Board', sport: 'Windsurf' },
      { id: 'ex-g2', name: '5.3 m² wave', kind: 'Sail', sport: 'Windsurf' },
      { id: 'ex-g3', name: '4.7 m² wave', kind: 'Sail', sport: 'Windsurf' },
      { id: 'ex-g4', name: '4/3 steamer', kind: 'Wetsuit', sport: 'Surf' },
      { id: 'ex-g5', name: "9'2 longboard", kind: 'Board', sport: 'Surf' },
    ],
    sessions: [
      { id: 'ex-x1', spotId: 'ex-valde', snapshotId: 'ex-s1', date: t(1, 14.5), rating: 4, felt: 9, gusts: 'Gusty', water: 'Chop', gearIds: ['ex-g1', 'ex-g2'], gear: '', start: '14:30', end: '17:05', notes: 'Gusty inside until 3 pm, then clean.', track },
      { id: 'ex-x2', spotId: 'ex-valde', snapshotId: 'ex-s2', date: t(4, 13), rating: 5, felt: 10, gusts: 'Steady', water: 'Chop', gearIds: ['ex-g1', 'ex-g3'], gear: '', start: '13:00', end: '16:00', notes: 'Clean and steady, mid tide.' },
      { id: 'ex-x3', spotId: 'ex-valde', snapshotId: 'ex-s3', date: t(9, 14), rating: 2, felt: 10, gusts: 'Very gusty', water: 'Waves', gearIds: ['ex-g3'], gear: '', start: '14:00', end: '15:00', notes: 'Too gusty, went in early.' },

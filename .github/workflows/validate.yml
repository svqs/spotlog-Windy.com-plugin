name: validate
on:
    pull_request:
    push:
        branches: [main]
    workflow_dispatch:
permissions:
    contents: read
jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: npm
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.13'
            - run: npm ci
            - run: npm run check
            - run: npm run test:package
            - run: npm run rebuild:harness
            - run: python3 -m pip install -r harness/requirements.txt
            - run: python3 -m playwright install --with-deps chromium
            - name: Browser checks
              run: |
                  mkdir -p /tmp/spotlog-e2e /tmp/spotlog-scenarios /tmp/spotlog-regressions
                  python3 -m http.server 8765 >/tmp/spotlog-server.log 2>&1 &
                  for attempt in 1 2 3 4 5; do curl -fsS http://localhost:8765/harness/index.html >/dev/null && break || sleep 1; done
                  npm run check:browser
                  SPOTLOG_TEST_URL='http://localhost:8765/harness/index.html?bundle=min' python3 harness/e2e.py /tmp/spotlog-e2e-min
            - name: Generated pages match source
              run: git diff --exit-code -- harness/sandbox.html harness/stylelab/index.html harness/stylelab/preview.html
            - uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: browser-evidence
                  path: |
                      /tmp/spotlog-e2e
                      /tmp/spotlog-e2e-min
                      /tmp/spotlog-scenarios
                      /tmp/spotlog-regressions
                      /tmp/spotlog-learning
                      /tmp/spotlog-learning-browser

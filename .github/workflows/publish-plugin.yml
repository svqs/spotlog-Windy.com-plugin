name: publish-plugin

on:
    workflow_dispatch:

jobs:
    publish-plugin:
        runs-on: ubuntu-latest
        env:
            WINDY_API_KEY: '${{ secrets.WINDY_API_KEY }}'
        steps:
            - uses: actions/checkout@v7
            - name: Build
              run: |
                  npm install
                  npm run build
            - name: Publish Plugin
              run: |
                  if [ -z "$WINDY_API_KEY" ]; then
                    echo "Secret WINDY_API_KEY is not configured" >&2
                    exit 1
                  fi
                  cd dist
                  echo "Creating plugin archive..."
                  echo "{\"repositoryName\": \"${{ github.repository }}\", \"commitSha\": \"${{ github.sha }}\", \"repositoryOwner\": \"${{ github.repository_owner }}\"}" > /tmp/plugin-info.json
                  mv plugin.json /tmp
                  jq -s '.[0] * .[1]' /tmp/plugin.json /tmp/plugin-info.json > plugin.json
                  tar cf ../plugin.tar .
                  echo "Publishing plugin..."
                  set +e
                  curl -s --fail-with-body -o /tmp/response.txt -w '%{http_code}' -XPOST 'https://node.windy.com/plugins/v1.0/upload' -H "x-windy-api-key: ${WINDY_API_KEY}" -F "plugin_archive=@../plugin.tar" > /tmp/status.txt
                  ok=$?
                  set -e
                  echo ""
                  echo "HTTP status: $(cat /tmp/status.txt)"
                  echo "Windy answered:"
                  cat /tmp/response.txt; echo ""
                  url=$(sed 's#\\/#/#g' /tmp/response.txt | grep -oE 'https://windy-plugins\.com/[^" ]+plugin\.min\.js' | head -1 || true)
                  if [ -n "$url" ]; then
                    echo ""
                    echo "=============================================================="
                    echo "INSTALL URL:  $url"
                    echo "=============================================================="
                    {
                      echo "## Spotlog is published"
                      echo ""
                      echo "Install URL (windy.com/plugins > Load plugin directly from URL):"
                      echo ""
                      echo "\`$url\`"
                    } >> "$GITHUB_STEP_SUMMARY"
                  else
                    {
                      echo "## Windy's answer"
                      echo ""
                      echo '```'
                      cat /tmp/response.txt
                      echo '```'
                    } >> "$GITHUB_STEP_SUMMARY"
                  fi
                  exit $ok
